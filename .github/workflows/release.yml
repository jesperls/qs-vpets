name: CI & Portable Release

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to publish as a GitHub Release (e.g. v0.8.0)"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-and-bundle:
    name: Check & Build Portable (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-24.04
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync version from release tag
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -n "$tag" ]; then
            ./scripts/bump-version.sh "$tag"
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Formatting check
        run: nix fmt -- --ci

      - name: Flake check (unit tests, qmllint, HM module, portable bundle)
        run: nix flake check -L

      - name: Stage & smoke-test portable release archive
        run: |
          nix build -L --out-link result-portable ".#packages.${{ matrix.arch }}.portable"
          mkdir -p dist
          cp -L result-portable/qs-vpets-portable-${{ matrix.arch }}.tar.zst* dist/
          ls -lh dist/

          # GitHub's Ubuntu 24.04 runner image enables unprivileged userns restriction by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zstd
          tmp_test=$(mktemp -d)
          mkdir -p "$tmp_test/home"
          tar -I zstd -xf "dist/qs-vpets-portable-${{ matrix.arch }}.tar.zst" -C "$tmp_test"
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_STATE_HOME HOME="$tmp_test/home" \
            "$tmp_test/qs-vpets-portable-${{ matrix.arch }}/install" --no-autostart
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_STATE_HOME HOME="$tmp_test/home" \
            QS_VPETS_FORCE_NAMESPACE=1 "$tmp_test/home/.local/bin/qs-vpets" --version
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME -u XDG_STATE_HOME HOME="$tmp_test/home" \
            "$tmp_test/home/.local/opt/qs-vpets/uninstall"
          rm -rf "$tmp_test"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}
          path: dist/qs-vpets-portable-${{ matrix.arch }}.tar.zst*
          if-no-files-found: error

  check-and-bundle-macos:
    name: Check & Build macOS (aarch64-darwin)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync version from release tag
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -n "$tag" ]; then
            ./scripts/bump-version.sh "$tag"
          fi

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install qtbase qtdeclarative qtsvg qtimageformats zstd shellcheck

      - name: Unit, cognition & soak tests + shellcheck
        run: |
          node tests/test_sprites.js
          node tests/test_cognition.js
          node tests/test_soak.js
          bash -n scripts/qs-vpets-macos.sh scripts/bump-version.sh macos/build-icns.sh install.sh
          shellcheck scripts/qs-vpets-macos.sh scripts/bump-version.sh macos/build-icns.sh install.sh

      - name: Build & bundle Apple Silicon .app (CMake + Qt6 + macdeployqt)
        run: |
          brew_prefix="$(brew --prefix)"
          qtbase_prefix="$(brew --prefix qtbase)"
          cmake -S macos -B build-macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$brew_prefix"
          cmake --build build-macos --config Release --parallel

          ln -sfn "Pokemon Sanctuary.app/Contents/Resources/qml" build-macos/qml-scan
          "$qtbase_prefix/bin/macdeployqt" "build-macos/Pokemon Sanctuary.app" \
            -qmldir=build-macos/qml-scan \
            -libpath="$brew_prefix/lib" \
            -libpath="$(brew --prefix qtsvg)/lib"
          codesign --force --deep --sign - "build-macos/Pokemon Sanctuary.app"

          stage_dir="dist-stage/qs-vpets-macos-arm64"
          rm -rf dist-stage dist
          mkdir -p "$stage_dir/bin" dist
          cp -R "build-macos/Pokemon Sanctuary.app" "$stage_dir/Pokemon Sanctuary.app"
          install -m 0755 scripts/qs-vpets-macos.sh "$stage_dir/bin/qs-vpets"

          cat > "$stage_dir/install" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          here=$(cd "$(dirname "$0")" && pwd)
          prefix="${QS_VPETS_PREFIX:-$HOME/.local}"
          appsDir="${QS_VPETS_MACOS_APPS_DIR:-$HOME/Applications}"
          autostart="1"
          for arg in "$@"; do
            case "$arg" in
              --no-autostart) autostart="0" ;;
              --autostart) autostart="1" ;;
            esac
          done
          if [ -x "$prefix/bin/qs-vpets" ]; then
            "$prefix/bin/qs-vpets" stop >/dev/null 2>&1 || true
          fi
          mkdir -p "$appsDir" "$prefix/bin"
          rm -rf "$appsDir/Pokemon Sanctuary.app" "$appsDir/Pokémon Sanctuary.app"
          cp -R "$here/Pokemon Sanctuary.app" "$appsDir/Pokemon Sanctuary.app"
          install -m 0755 "$here/bin/qs-vpets" "$prefix/bin/qs-vpets"
          cat > "$prefix/bin/qs-vpets-uninstall" <<UNEOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -x "$prefix/bin/qs-vpets" ]; then
            "$prefix/bin/qs-vpets" stop >/dev/null 2>&1 || true
            "$prefix/bin/qs-vpets" autostart disable >/dev/null 2>&1 || true
          fi
          rm -rf "$appsDir/Pokemon Sanctuary.app" "$appsDir/Pokémon Sanctuary.app"
          rm -f "$prefix/bin/qs-vpets" "$prefix/bin/qs-vpets-uninstall"
          UNEOF
          chmod 0755 "$prefix/bin/qs-vpets-uninstall"
          if [ "$autostart" = "1" ]; then
            QS_VPETS_MACOS_BIN="$appsDir/Pokemon Sanctuary.app/Contents/MacOS/Pokemon Sanctuary" \
              "$prefix/bin/qs-vpets" autostart enable >/dev/null || true
          fi
          echo "Installed Pokemon Sanctuary into $appsDir/Pokemon Sanctuary.app"
          EOF
          chmod 0755 "$stage_dir/install"
          shellcheck "$stage_dir/install"

          tar -cf - -C dist-stage qs-vpets-macos-arm64 | zstd -19 -T0 -o dist/qs-vpets-macos-arm64.tar.zst
          (cd dist && shasum -a 256 qs-vpets-macos-arm64.tar.zst > qs-vpets-macos-arm64.tar.zst.sha256)
          ls -lh dist/

      - name: Smoke-test live macOS app & IPC on Apple Silicon
        run: |
          # 1. Verify ./install.sh --native end-to-end
          tmp_native=$(mktemp -d)
          mkdir -p "$tmp_native/home"
          HOME="$tmp_native/home" ./install.sh --native --no-autostart
          export QS_VPETS_SOCKET="/tmp/qs-vpets-nat-$$.sock"
          HOME="$tmp_native/home" "$tmp_native/home/.local/bin/qs-vpets" start || {
            cat "$tmp_native/home/.local/state/qs-vpets/qs-vpets.log" >&2 || true
            exit 1
          }
          HOME="$tmp_native/home" "$tmp_native/home/.local/bin/qs-vpets" status >/dev/null
          HOME="$tmp_native/home" "$tmp_native/home/.local/bin/qs-vpets" stop
          HOME="$tmp_native/home" ./install.sh --uninstall
          rm -rf "$tmp_native"

          # 2. Verify self-contained macdeployqt bundle end-to-end
          tmp_test=$(mktemp -d)
          mkdir -p "$tmp_test/home"
          zstd -dc dist/qs-vpets-macos-arm64.tar.zst | tar -xf - -C "$tmp_test"
          HOME="$tmp_test/home" "$tmp_test/qs-vpets-macos-arm64/install" --no-autostart
          HOME="$tmp_test/home" "$tmp_test/home/.local/bin/qs-vpets" --version

          export QS_VPETS_SOCKET="/tmp/qs-vpets-ci-$$.sock"
          HOME="$tmp_test/home" "$tmp_test/home/.local/bin/qs-vpets" start || {
            cat "$tmp_test/home/.local/state/qs-vpets/qs-vpets.log" >&2 || true
            exit 1
          }
          sleep 1
          status_json=$(HOME="$tmp_test/home" "$tmp_test/home/.local/bin/qs-vpets" status) || {
            cat "$tmp_test/home/.local/state/qs-vpets/qs-vpets.log" >&2 || true
            exit 1
          }
          printf '%s\n' "$status_json"
          STATUS_JSON="$status_json" node -e '
            const s = JSON.parse(process.env.STATUS_JSON);
            if (s.totalCount < 2 || s.roamingCount < 1) {
              throw new Error("Unexpected status counts: " + JSON.stringify(s));
            }
          '
          roam_win_json=$(HOME="$tmp_test/home" "$tmp_test/home/Applications/Pokemon Sanctuary.app/Contents/MacOS/Pokemon Sanctuary" --ipc win_debug)
          printf '%s\n' "$roam_win_json"
          WIN_JSON="$roam_win_json" node -e '
            const w = JSON.parse(process.env.WIN_JSON);
            if (w.visibleWindows < 1) {
              throw new Error("Expected visible roaming overlay windows, got: " + JSON.stringify(w));
            }
          '

          HOME="$tmp_test/home" "$tmp_test/home/.local/bin/qs-vpets" open
          sleep 0.5
          pen_win_json=$(HOME="$tmp_test/home" "$tmp_test/home/Applications/Pokemon Sanctuary.app/Contents/MacOS/Pokemon Sanctuary" --ipc win_debug)
          printf '%s\n' "$pen_win_json"
          WIN_JSON="$pen_win_json" node -e '
            const w = JSON.parse(process.env.WIN_JSON);
            const hasSanctuary = w.windows.some(x => x.visible && x.visibility !== 0 && x.title.includes("Sanctuary"));
            if (!hasSanctuary) {
              throw new Error("Expected visible SanctuaryWindow, got: " + JSON.stringify(w));
            }
          '

          HOME="$tmp_test/home" "$tmp_test/home/.local/bin/qs-vpets" pet
          HOME="$tmp_test/home" "$tmp_test/home/.local/bin/qs-vpets" flush
          HOME="$tmp_test/home" "$tmp_test/home/.local/bin/qs-vpets" stop
          HOME="$tmp_test/home" "$tmp_test/home/.local/bin/qs-vpets-uninstall"
          rm -rf "$tmp_test"

      - name: Install Nix & verify aarch64-darwin flake check
        uses: DeterminateSystems/nix-installer-action@main

      - name: Nix flake check (aarch64-darwin package & launchd HM module)
        run: nix flake check -L

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-aarch64-darwin
          path: dist/qs-vpets-macos-arm64.tar.zst*
          if-no-files-found: error

  check-and-bundle-windows:
    name: Check & Build Windows (x86_64-windows)
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync version from release tag
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -n "$tag" ]; then
            ./scripts/bump-version.sh "$tag"
          fi

      - name: Install Qt6 (MSVC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qtimageformats qtsvg"
          cache: true

      - name: Unit, cognition, soak tests & PowerShell/QML lint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node tests/test_sprites.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_cognition.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_soak.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($ps in @("install.ps1", "scripts/qs-vpets.ps1")) {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $ps).Path, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              $errs | ForEach-Object { Write-Error "$ps`: $_" }
              exit 1
            }
          }

          $qmlFiles = @(
            "windows/qml/shell.qml",
            "windows/qml/services/WindowTracker.qml",
            "windows/qml/services/InputTracker.qml",
            "windows/qml/services/MediaTracker.qml",
            "windows/qml/services/SystemMonitor.qml",
            "windows/qml/components/PetWindow.qml",
            "windows/qml/components/SanctuaryWindow.qml"
          )
          $lintOut = & qmllint --bare @qmlFiles 2>&1
          if ($lintOut -match '\[syntax\]') {
            $lintOut | Write-Error
            exit 1
          }

      - name: Build & bundle Windows app (CMake + MSVC + windeployqt)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S windows -B build-windows -A x64 -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $stageDir = "dist-stage\qs-vpets-windows-x86_64"
          Remove-Item -Recurse -Force dist-stage, dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$stageDir\bin", "dist" -Force | Out-Null

          Copy-Item -LiteralPath "build-windows\Release\Pokemon Sanctuary.exe" -Destination $stageDir -Force
          Copy-Item -Path "build-windows\Release\qml" -Destination $stageDir -Recurse -Force
          Copy-Item -LiteralPath "scripts\qs-vpets.ps1" -Destination "$stageDir\bin\qs-vpets.ps1" -Force
          Copy-Item -LiteralPath "scripts\qs-vpets.cmd" -Destination "$stageDir\bin\qs-vpets.cmd" -Force
          Copy-Item -LiteralPath "VERSION" -Destination "$stageDir\VERSION" -Force

          & windeployqt --release --no-translations --compiler-runtime --qmldir "$stageDir\qml" "$stageDir\Pokemon Sanctuary.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "$stageDir\platforms\qwindows.dll")) {
            Write-Error "windeployqt did not deploy platforms\qwindows.dll"
            exit 1
          }
          if (-not (Test-Path "$stageDir\imageformats\qsvg.dll")) {
            Write-Error "windeployqt did not deploy imageformats\qsvg.dll"
            exit 1
          }

          Compress-Archive -Path $stageDir -DestinationPath "dist\qs-vpets-windows-x86_64.zip" -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath "dist\qs-vpets-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  qs-vpets-windows-x86_64.zip" | Set-Content -LiteralPath "dist\qs-vpets-windows-x86_64.zip.sha256" -Encoding Ascii
          Get-ChildItem dist

      - name: Smoke-test live Windows app & IPC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tmpRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("qs-vpets-ci-" + [Guid]::NewGuid().ToString("N"))
          $installDir = Join-Path $tmpRoot "install"
          $cfgDir = Join-Path $tmpRoot "cfg"
          $stateDir = Join-Path $tmpRoot "state"
          New-Item -ItemType Directory -Path $cfgDir, $stateDir -Force | Out-Null

          $env:QS_VPETS_INSTALL_DIR = $installDir
          $env:QS_VPETS_CONFIG_DIR = $cfgDir
          $env:QS_VPETS_STATE_DIR = $stateDir
          $env:QS_VPETS_SOCKET = "qs-vpets-ci-" + $PID
          $env:QS_VPETS_PORTABLE_URL = "file:///" + ((Resolve-Path "dist\qs-vpets-windows-x86_64.zip").Path -replace '\\', '/')

          try {
            & .\install.ps1 -Portable -NoAutostart
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $cli = Join-Path $installDir "bin\qs-vpets.ps1"
            $exe = Join-Path $installDir "Pokemon Sanctuary.exe"
            $env:QS_VPETS_WIN_BIN = $exe

            $verOut = & $cli --version
            Write-Host "Version: $verOut"
            if ($verOut -notmatch "qs-vpets") { throw "Unexpected version output: $verOut" }

            & $cli start
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 1

            $statusJson = (& $cli status) -join "`n"
            Write-Host $statusJson
            $statusObj = $statusJson | ConvertFrom-Json
            if ($statusObj.totalCount -lt 2 -or $statusObj.roamingCount -lt 1) {
              throw "Unexpected status counts: $statusJson"
            }

            $roamWinJson = (& $exe --ipc win_debug) -join "`n"
            Write-Host $roamWinJson
            $roamWin = $roamWinJson | ConvertFrom-Json
            if ($roamWin.visibleWindows -lt 1) {
              throw "Expected visible roaming overlay windows, got: $roamWinJson"
            }

            & $cli open
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Start-Sleep -Milliseconds 600

            $penWinJson = (& $exe --ipc win_debug) -join "`n"
            Write-Host $penWinJson
            $penWin = $penWinJson | ConvertFrom-Json
            $hasSanctuary = @($penWin.windows | Where-Object { $_.visible -and $_.visibility -ne 0 -and $_.title -like "*Sanctuary*" }).Count -gt 0
            if (-not $hasSanctuary) {
              throw "Expected visible SanctuaryWindow, got: $penWinJson"
            }

            & $cli pet
            & $cli flush
            & $cli stop
            & .\install.ps1 -Uninstall
            if (Test-Path -LiteralPath $installDir) {
              throw "Uninstall did not remove $installDir"
            }
          } finally {
            Get-Process -Name "Pokemon Sanctuary" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $tmpRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-x86_64-windows
          path: dist/qs-vpets-windows-x86_64.zip*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [check-and-bundle, check-and-bundle-macos, check-and-bundle-windows]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main for version bump
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump version files & commit to main
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          ./scripts/bump-version.sh "$tag"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION macos/CMakeLists.txt macos/src/main.mm windows/CMakeLists.txt windows/src/main.cpp scripts/qs-vpets.sh scripts/qs-vpets-macos.sh scripts/qs-vpets.ps1 packaging/aur/PKGBUILD packaging/desktop/io.github.jesperls.qs_vpets.metainfo.xml
            git commit -m "chore(release): bump version to ${tag} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Download portable artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          generate_release_notes: true
          files: |
            release-assets/qs-vpets-portable-*.tar.zst
            release-assets/qs-vpets-portable-*.tar.zst.sha256
            release-assets/qs-vpets-macos-*.tar.zst
            release-assets/qs-vpets-macos-*.tar.zst.sha256
            release-assets/qs-vpets-windows-*.zip
            release-assets/qs-vpets-windows-*.zip.sha256
