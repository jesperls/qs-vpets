<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="100%" stop-color="#0b131d"/>
    </linearGradient>
    <linearGradient id="topHalf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#53bdfa"/>
      <stop offset="100%" stop-color="#3692d6"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9cf2cf"/>
      <stop offset="100%" stop-color="#54d49e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#53bdfa" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#53bdfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian squircle container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#263a4f" stroke-width="2"/>
  <path d="M36 10 H92 A26 26 0 0 1 116 28 A28 28 0 0 0 92 12 H36 A28 28 0 0 0 12 28 A26 26 0 0 1 36 10 Z" fill="#ffffff" fill-opacity="0.09"/>
  <circle cx="64" cy="64" r="50" fill="url(#halo)"/>

  <!-- Sanctuary outer ring / arch -->
  <circle cx="64" cy="66" r="38" fill="#0f1a27" stroke="#2f4b68" stroke-width="3"/>

  <!-- Stylized Poké-Sanctuary upper dome -->
  <path d="M27.5 61 A36.5 36.5 0 0 1 100.5 61 L79 61 A15 15 0 0 0 49 61 Z" fill="url(#topHalf)"/>

  <!-- Lower pasture hemisphere -->
  <path d="M27.5 71 A36.5 36.5 0 0 0 100.5 71 L79 71 A15 15 0 0 1 49 71 Z" fill="#18283b"/>

  <!-- Subtle companion silhouette ears above the core -->
  <path d="M47 45 L41 27 L56 38 Z" fill="#101c2a"/>
  <path d="M81 45 L87 27 L72 38 Z" fill="#101c2a"/>
  <path d="M48.5 43 L44 30.5 L54.5 38.5 Z" fill="#6ce5b1" fill-opacity="0.88"/>
  <path d="M79.5 43 L84 30.5 L73.5 38.5 Z" fill="#6ce5b1" fill-opacity="0.88"/>

  <!-- Center Sanctuary core -->
  <circle cx="64" cy="66" r="14.5" fill="#0b131d" stroke="#2f4b68" stroke-width="3"/>
  <circle cx="64" cy="66" r="8" fill="url(#coreGlow)"/>
  <circle cx="61.5" cy="63.5" r="2.2" fill="#ffffff" fill-opacity="0.75"/>
